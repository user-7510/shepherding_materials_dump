<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牧養材料</title>
    <style>
        :root {
            --bg-color: #fcfaf7;
            --text-color: #333;
            --font-mobile: 1.1rem;
            --font-desktop: 1.25rem;
            --line-height: 1.8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
        }

        #content-container {
            width: 100%;
            max-width: 800px;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            font-size: clamp(var(--font-mobile), 4vw, var(--font-desktop));
            line-height: var(--line-height);
        }

        .loading {
            color: #888;
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <div id="content-container">
        <div class="loading">Loading...</div>
    </div>

    <script>
        const TEXT_FILE_URL = 'https://raw.githubusercontent.com/user-7510/shepherding_materials_dump/refs/heads/main/data/A01_15s.txt';

        async function loadTextFile() {
            const container = document.getElementById('content-container');

            try {
                const response = await fetch(TEXT_FILE_URL, { cache: 'no-store' });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}：無法讀取檔案，請檢查路徑是否正確（需為 Raw 連結）`);
                }

                container.textContent = await response.text();
            } catch (error) {
                container.innerHTML = `<div style="color:red;">錯誤: ${error.message}</div>`;
            }
        }

        loadTextFile();
    </script>

</body>
</html>
